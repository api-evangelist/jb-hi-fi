      http_status: 200
      fetched: '2026-10-21'
      quote: 'To request access to the personal information that JB Hi-Fi holds about you, or to update, correct or delete that information, please submit a privacy enquiry.'
    - source: https://www.jbhifi.com.au/pages/help-and-support/privacy-policy
      http_status: 200
      fetched: '2026-10-21'
      quote: 'Where we have processed your personal information by automated means, you may request to receive your personal information in a structured, commonly used and machine-readable format. You may also request that, where possible, we transmit such data to another third-party controller.'
    note: >-
      Access, correction and deletion are offered to all customers under the Australian Privacy Act, through a
      privacy enquiry, with a possible $25 access fee and identity check. Erasure, portability and consent
      withdrawal are stated as additional GDPR rights for EU customers only (section "Additional information
      for EU customers"). No response time is stated.
