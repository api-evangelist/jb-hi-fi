      quote: 'Upon your request, JB Hi-Fi will provide access to your personal information that we hold (except in certain circumstances set out in the Privacy Act 1988 (Cth)). JB Hi-Fi reserves the right to charge you an administration fee of $25 for providing access to your personal information and will, of course, require some proof of your identity before providing information to you.'
