name: JB Hi-Fi UCP Shopping MCP Server
type: MCPServer
generated: '2026-10-21'
method: probed
source: https://www.jbhifi.com.au/api/ucp/mcp
status: official
description: Remote MCP endpoint for JB Hi-Fi's Shopify-hosted online store implementing the Universal Commerce Protocol (UCP) shopping service (dev.ucp.shopping). Advertised in https://www.jbhifi.com.au/agents.md
  and the /.well-known/ucp profile, which names the same service at https://prod-jbhifi.myshopify.com/api/ucp/mcp (UCP version 2026-08-25). A tools/list JSON-RPC call on 2026-10-21 returned HTTP 200 with
  13 tools without credentials.
deployment:
  mode: remote
  endpoint: https://www.jbhifi.com.au/api/ucp/mcp
  auth: unknown
  verified: probed
  auth_note: tools/list answered without credentials. agents.md requires server-to-server agents to identify themselves with Shopify Web Bot Auth and to follow the service authentication requirements; purchase
    completion requires buyer authorization.
  alternate_endpoints:
  - https://prod-jbhifi.myshopify.com/api/ucp/mcp
protocol:
  ucp_version: '2026-08-25'
  ucp_profile: https://www.jbhifi.com.au/.well-known/ucp
  openrpc_schema: https://ucp.dev/2026-08-25/services/shopping/mcp.openrpc.json
documentation:
- https://www.jbhifi.com.au/agents.md
- https://shopify.dev/docs/agents
browser_surface:
