apis:
- aid: jb-hi-fi:jb-hi-fi-ucp-shopping-mcp
  name: JB Hi-Fi UCP Shopping MCP Server
  description: Universal Commerce Protocol (UCP) shopping service for the JB Hi-Fi online store, advertised in the store's agents.md and its /.well-known/ucp profile, exposed as a remote MCP endpoint whose tools/list returns 13 tools for catalog search and lookup, product details, carts, checkout and orders. The store runs on Shopify; the UCP profile names the same service at prod-jbhifi.myshopify.com/api/ucp/mcp.
  humanURL: https://www.jbhifi.com.au/agents.md
